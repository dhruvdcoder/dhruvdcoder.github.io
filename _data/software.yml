      - repo: dhruvdcoder/LoFlexMDM
        description: Official implementation for Insertion Based Sequence Generation with Learnable Order Dynamics.
      - repo: dhruvdcoder/ctmc_dilm
        description: Official implementation for A Continuous-Time Markov Chain Framework for Insertion Language Models.
