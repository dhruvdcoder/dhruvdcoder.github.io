        description: Official implementation for Insertion Language Models — sequence generation with arbitrary-position insertions.
        stars: 6
      - repo: dhruvdcoder/HyperA
        description: A PyTorch implementation of hyperbolic neural networks and attention mechanisms.
        stars: 12
      - repo: iesl/box-embeddings
        description: Box Embeddings as Modules.
        stars: 114
      - repo: iesl/box-mlc-iclr-2022
        description: Official repository for Modeling Label Space Interactions in Multi-label Classification using Box Embeddings.
        stars: 13

  - title: tools
    repos:
      - repo: dhruvdcoder/wandb-utils
        description: Utility functions and a command-line interface built on the official Weights & Biases API.
