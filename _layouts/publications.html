---
layout: default
---
<div class="content content--wide">
  <div style="position: relative; z-index: 1;">
    <h1 data-reveal>{{ page.title | default: "Publications" }}</h1>
    {{ content }}

    {% assign pubs = site.publications | sort: "year" | reverse %}
    <ul class="mentor-list" style="list-style: none; padding: 0; margin: 0;">
      {% for pub in pubs %}
        {% include publication-item.html pub=pub %}
      {% endfor %}
    </ul>
  </div>
</div>
