<nav class="nav">
  <a class="nav__brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <ul class="nav__links">
    {% for item in site.data.nav %}
      {% assign is_current = false %}
      {% if page.url == item.url or (item.url != "/" and page.url contains item.url) %}
        {% assign is_current = true %}
      {% endif %}
      <li>
        <a href="{{ item.url | relative_url }}" {% if is_current %}aria-current="page"{% endif %}>{{ item.title }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
